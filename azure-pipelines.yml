
# CI/CD: Build, push, and deploy the gaming application

trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'eaf502e0-fce3-4f9f-83d9-e9a93e5bf474'
  azureResourceManagerServiceConnection: 'gaming-azure-connection'
  imageRepository: 'ananthsaigamingapplicationdeployment'
  containerRegistry: 'hostinggameacr2026.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build Docker image
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Deploy
  displayName: Deploy to Azure Container Apps
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Update gaming application
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: Deploy new image
      inputs:
        azureSubscription: $(azureResourceManagerServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name devopscontainer \
            --resource-group devopsdeployment \
            --image "$(containerRegistry)/$(imageRepository):$(tag)"
